# Render Blueprint: creates the database, the Django API and the React website.
# Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: sanrice-db
    plan: free
    databaseName: san_rice
    user: san_user

services:
  # ---------- Django API + admin ----------
  - type: web
    runtime: python
    name: sanrice-api
    rootDir: backend
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: sanrice-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CLOUDINARY_URL            # from your Cloudinary dashboard
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME # your admin login on the live site
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        value: sanrice.ambai@gmail.com

  # ---------- React website ----------
  - type: web
    runtime: static
    name: sanrice-website
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL              # change if Render gives the API a different address
        value: https://sanrice-api.onrender.com/api
